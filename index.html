<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarZ重启：零 · 开发端·全量任务图</title>
<style>
:root{--bg:#101315;--panel:#1b2024;--line:#647079;--text:#edf2f3;--muted:#9eabb1;--accent:#e1b75d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}
header{height:70px;padding:10px 18px;border-bottom:1px solid #30383d;background:#171b1e;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:4px}.tools{margin-left:auto;display:flex;gap:7px;align-items:center}.tools button,.tools label,.tools select,.tools input{height:32px;border:1px solid #465159;background:#252c31;color:var(--text);border-radius:4px;padding:0 9px;font-size:12px}.tools button,.tools label{cursor:pointer;display:inline-flex;align-items:center}.tools button:hover,.tools label:hover{background:#343e44}.tools input[type=file]{display:none}.tools input[type=text]{width:220px}.tools select{min-width:110px}
#viewport{height:calc(100vh - 70px);overflow:auto;cursor:grab;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.board{position:relative;width:9200px;height:3300px;padding:0 30px 30px;transform-origin:0 0}
svg{position:absolute;inset:0;width:9200px;height:3300px;pointer-events:none}.edge{fill:none;stroke:var(--line);stroke-width:1.5;opacity:.7}.edge.explicit{stroke:#e1b75d;stroke-width:2.5}.edge.group{stroke:#465158;stroke-dasharray:5 5;opacity:.45}.edge.flow{stroke:#7e8b92;stroke-dasharray:2 5;opacity:.55}.group-title{position:absolute;left:30px;width:145px;padding:8px 10px;border-right:2px solid #4c5960;color:#c9d1d5;font-size:13px;font-weight:bold;background:#151a1d}
.task{position:absolute;width:250px;min-height:102px;padding:8px 9px;background:var(--panel);border:1px solid #424c52;border-left:4px solid #73818a;border-radius:4px;box-shadow:0 5px 15px #0007;overflow:hidden}.task:hover{z-index:3;border-color:#b3c0c5;box-shadow:0 8px 24px #000b}.task-id{color:var(--accent);font-size:11px;font-weight:bold}.task-title{color:#fff;font-size:12px;font-weight:bold;margin:2px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task p{margin:2px 0;color:var(--muted);font-size:10px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}.task b{color:#d7e0e4;font-weight:600}
.legend{position:fixed;right:14px;bottom:12px;background:#1d2327;border:1px solid #404b51;padding:8px 10px;color:var(--muted);font-size:11px;border-radius:4px;z-index:4}.legend i{display:inline-block;width:10px;height:10px;background:#73818a;border-left:3px solid var(--accent);margin-right:5px;vertical-align:-1px}
@media(max-width:800px){header{height:auto;min-height:104px;padding:8px 10px;align-content:flex-start;flex-wrap:wrap}h1{font-size:15px}.sub{font-size:10px}.tools{margin-left:0;width:100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tools input[type=text]{width:150px;min-width:150px}.tools select{min-width:95px}.tools button,.tools label{white-space:nowrap}#viewport{height:calc(100vh - 104px)}.legend{left:8px;right:8px;bottom:7px;font-size:9px;pointer-events:none}.task{box-shadow:0 3px 10px #0008}}
</style>
</head>
<body>
<header><div><h1>WarZ重启：零 · 开发端·全量任务图</h1><div class="sub" id="status">开发端：显示第一季、第二季预埋和全部任务字段</div></div><div class="tools"><input id="search" type="text" placeholder="搜索 ID、标题、物品、奖励"><select id="group"><option value="">全部任务组</option></select><label for="file">选择任务表 TXT</label><input id="file" type="file" accept=".txt,text/plain"><button onclick="zoom(-.1)">−</button><button onclick="resetView()">重置</button><button onclick="zoom(.1)">＋</button></div></header>
<div id="viewport"><main class="board" id="board"><svg id="edges"></svg></main></div><div class="legend"><i></i>矩形=一条任务；线性段=只连相邻任务；并列支线=满足开放条件后可自由选择；金色连线=明确硬前置或关键主线接入；灰色虚线=普通流程提示</div>
<script>
const PREFIX='引|主|终|武|枪|医|杂|服|黑|人|关|点|台|实|美|入|工|邪|卡|暗';
const linearGroups=new Set(['引','主','终','美','入','工','邪']);
let tasks=[],nodes=new Map(),scale=1;const board=document.getElementById('board'),edges=document.getElementById('edges'),vp=document.getElementById('viewport'),search=document.getElementById('search'),group=document.getElementById('group'),status=document.getElementById('status');
function esc(v){const d=document.createElement('div');d.textContent=String(v||'');return d.innerHTML}const get=(b,n)=>{const m=b.match(new RegExp('^'+n+'：?\\s*(.+)$','m'));return m?m[1].trim():''};
function inferredPre(id){const p=id.split('-')[0],n=parseInt(id.match(/\d+/)[0],10),roots={主:'引-10',武:'引-10',枪:'武-06',医:'引-10',杂:'引-10',服:'引-10',黑:'引-10',人:'引-10',关:'引-10',点:'引-10',台:'引-10',实:'台-07',美:'主-03',入:'美-10',工:'入-10',邪:'主-06',卡:'台-07'};if(p==='引')return n>1?'引-'+String(n-1).padStart(2,'0'):'';if(p==='主')return n>1?'主-'+String(n-1).padStart(2,'0'):'引-10';if(p==='终')return n>1?'终-'+String(n-1).padStart(2,'0'):'主-18';if(['美','入','工','邪'].includes(p))return n>1?p+'-'+String(n-1).padStart(2,'0'):(roots[p]||'');if(p==='暗')return n===1?'五名商人累计好感≥3.0（各商人经验≥30,000）':n===6?'暗-01~05':n>6?'暗-'+String(n-1).padStart(2,'0'):'';const parallelGroups=['武','枪','医','杂','服','黑','人','关','点','台','实','卡'];return parallelGroups.includes(p)&&n===1?(roots[p]||''):''}
function parse(text){const out=[],header=new RegExp('^【((?:'+PREFIX+')-\\d{2}[a-z]?)】\\s*(.+)$');let cur=null;String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).forEach(line=>{const h=line.match(header);if(h){if(cur){if(!cur.pre){cur.pre=inferredPre(cur.id);cur.preKind=cur.pre?'建议':''}out.push(cur)}cur={id:h[1],title:h[2].trim(),pre:'',preKind:'',target:'',submit:'',reward:'',merchantXp:'',group:h[1].split('-')[0]};return}if(!cur)return;let m;if(m=line.match(/^前置(?:任务)?：\s*(.*)$/)){cur.pre=m[1].trim();cur.preKind='硬'}else if(m=line.match(/^目标：\s*(.*)$/))cur.target=m[1].trim();else if(m=line.match(/^提交物(?:品)?：\s*(.*)$/))cur.submit=m[1].trim();else if(m=line.match(/^奖励：\s*(.*)$/))cur.reward=m[1].trim();else if(m=line.match(/^商人经验(?:变动)?：\s*(.*)$/))cur.merchantXp=cur.merchantXp?cur.merchantXp+' / '+m[1].trim():m[1].trim()});if(cur){if(!cur.pre){cur.pre=inferredPre(cur.id);cur.preKind=cur.pre?'建议':''}out.push(cur)}return out}
function isFirstSeason(t){return true}function build(){board.querySelectorAll('.task,.group-title').forEach(e=>e.remove());edges.innerHTML='';nodes.clear();const groups=[...new Set(tasks.filter(isFirstSeason).map(t=>t.group))],visible=tasks.filter(t=>{const q=search.value.trim().toLowerCase();return isFirstSeason(t)&&(!group.value||t.group===group.value)&&(!q||[t.id,t.title,t.pre,t.target,t.submit,t.reward,t.merchantXp].join(' ').toLowerCase().includes(q))});const by={};visible.forEach(t=>(by[t.group]??=[]).push(t));groups.forEach((g,gi)=>{if(!by[g]?.length)return;const y=36+gi*155;const h=document.createElement('div');h.className='group-title';h.style.top=y+'px';h.textContent=g+' 组（'+by[g].length+' 条 · '+(linearGroups.has(g)?'线性段':'并列支线')+'）';board.appendChild(h);by[g].forEach((t,idx)=>{const x=195+idx*285,n=document.createElement('article');n.className='task';n.dataset.id=t.id;n.style.left=x+'px';n.style.top=(y+2)+'px';n.innerHTML='<div class="task-id">'+esc(t.id)+'</div><div class="task-title" title="'+esc(t.title)+'">'+esc(t.title)+'</div><p><b>前置'+(t.preKind?'（'+t.preKind+'）':'')+'：</b>'+esc(t.pre||'无')+'</p><p><b>目标：</b>'+esc(t.target||'未填写')+'</p>'+(t.submit?'<p><b>提交：</b>'+esc(t.submit)+'</p>':'')+'<p><b>奖励：</b>'+esc(t.reward||'未填写')+'</p>'+(t.merchantXp?'<p><b>商人经验：</b>'+esc(t.merchantXp)+'</p>':'');board.appendChild(n);nodes.set(t.id,{el:n,x,y:y+2});});});connect(by);status.textContent='任务表已载入 '+tasks.length+' 条 · 当前显示 '+visible.length+' 条 · 金色线为硬前置，灰色虚线为关键章节交接；建议前置仅显示在任务卡内'}
function connect(by){const gs=Object.keys(by);gs.forEach(g=>{if(!linearGroups.has(g))return;const arr=by[g];for(let i=1;i<arr.length;i++)line(arr[i-1].id,arr[i].id,'group')});const keyFlows=[['引-10','主-01'],['主-03','美-01'],['主-06','邪-01'],['台-07','实-01'],['台-07','卡-01'],['美-10','入-01'],['入-10','工-01'],['主-18','终-01']];keyFlows.forEach(([a,b])=>{if(nodes.has(a)&&nodes.has(b))line(a,b,'explicit')});tasks.forEach(t=>{if(!nodes.has(t.id)||!t.pre||t.preKind!=='硬')return;const refs=t.pre.match(new RegExp('(?:'+PREFIX+')-\\d{2}[a-z]?','g'))||[];refs.forEach(r=>{if(nodes.has(r))line(r,t.id,'explicit')})})}
function line(a,b,kind){const A=nodes.get(a),B=nodes.get(b);if(!A||!B)return;const x1=A.x+250,y1=A.y+51,x2=B.x,y2=B.y+51;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+x1+' '+y1+' C '+(x1+35)+' '+y1+', '+(x2-35)+' '+y2+', '+x2+' '+y2);p.setAttribute('class','edge '+(kind==='explicit'?'explicit':kind==='group'?'group':kind==='flow'?'flow':''));edges.appendChild(p)}
function zoom(d){scale=Math.min(1.25,Math.max(.45,+(scale+d).toFixed(2)));board.style.transform='scale('+scale+')';board.style.transformOrigin='0 0'}
function resetView(){scale=window.innerWidth<=800?.8:1;board.style.transform='scale('+scale+')';vp.scrollTo({left:0,top:0})}
search.oninput=build;group.onchange=build;const fileInput=document.getElementById('file');fileInput.onclick=()=>{status.textContent='等待选择任务表 TXT……'};fileInput.onchange=e=>{const f=e.target.files[0];if(!f){status.textContent='未选择文件';return}status.textContent='正在读取 '+f.name+'（通常不到 1 秒）……';const r=new FileReader();r.onload=()=>{try{tasks=parse(r.result);if(!tasks.length)throw new Error('未识别到正式任务标题');setGroups();build();status.textContent='导入完成：'+f.name+' · 共 '+tasks.length+' 条任务'}catch(err){status.textContent='导入失败：'+err.message+'；请选择任务全表 TXT'}fileInput.value=''};r.onerror=()=>{status.textContent='导入失败：文件无法读取，请重新选择 TXT';fileInput.value=''};r.readAsText(f,'UTF-8')};
function setGroups(){group.innerHTML='<option value="">全部任务组</option>'+[...new Set(tasks.map(t=>t.group))].map(g=>'<option>'+esc(g)+'</option>').join('')}
if(location.protocol==='http:'||location.protocol==='https:'){status.textContent='正在载入任务表……';const c=new AbortController();const timer=setTimeout(()=>c.abort(),8000);fetch('../WarZ重启：零·任务全表.txt',{signal:c.signal}).then(r=>{if(!r.ok)throw new Error('任务表不存在');return r.text()}).then(t=>{clearTimeout(timer);tasks=parse(t);if(!tasks.length)throw new Error('未识别到任务');setGroups();build();resetView()}).catch(e=>{clearTimeout(timer);status.textContent='自动载入失败：'+e.message+'；可手动选择任务表 TXT'})}
else{resetView()}
</script>
</body>
</html>
